appId: com.ibianqian.buglist
productName: 任务清单
directories:
  output: dist
  buildResources: build
files:
  - server.js
  - public/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*
win:
  target: portable
  icon: build/icon.ico   # 显式指定（win-unpacked 与 portable 自解压壳共用）
  # 未配置数字签名：自签证书无公信任锚（SmartScreen 仍会拦），价值不及泄露面，已从仓库移除。
portable:
  artifactName: 任务清单.exe
  # 注：portable 目标无法直接配置版本资源语言（electron-builder 限制：
  # nsis.language 对 portable 不生效、portable.language 会被 schema 拒绝），暂保持默认英文，后续再说
extraResources: []
asar:
  smartUnpack: true
